<!-- No Template -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library Clock</title>
<style>
:root{
  --bg:#f5f5f7;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.72);
  --line:rgba(255,255,255,.85);
  --shadow:0 20px 60px rgba(0,0,0,.08);
  --accent:#7c5cff;
  --blue:#4d9cff;
  --green:#34c759;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 10% 5%,rgba(255,255,255,.95),transparent 30%),
    radial-gradient(circle at 92% 8%,rgba(210,225,255,.55),transparent 28%),
    linear-gradient(135deg,#fff 0%,#f5f5f7 58%,#e9e9ee 100%);
}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.16}
.orb.a{width:360px;height:360px;left:-120px;top:-120px;background:#8b75ff}
.orb.b{width:420px;height:420px;right:-150px;bottom:-160px;background:#57b7ff}
.orb.c{width:250px;height:250px;left:45%;top:45%;background:#ff8fdc;opacity:.08}

.glass{
  background:var(--glass);
  border:1px solid var(--line);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.95);
  backdrop-filter:blur(24px) saturate(150%);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
}

.app{
  position:relative;
  z-index:1;
  width:100%;
  height:100vh;
  padding:clamp(24px,3vw,52px);
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:clamp(18px,3vh,34px);
}

.header{
  width:100%;
  min-height:68px;
  padding:12px 18px;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:13px}
.mark{
  width:42px;height:42px;border-radius:14px;
  display:grid;place-items:center;
  color:white;font-size:35px;
  background:#ffffff
  box-shadow:0 8px 25px rgba(100,100,255,.2);
  transform: translateY(-8px);
}
.brand-title{font-size:clamp(22px,2vw,30px);font-weight:650;letter-spacing:-.03em}
.brand-sub{margin-top:2px;color:var(--muted);font-size:12px}
.api-pill{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:999px;
  background:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.8);
  color:var(--muted);font-size:11px;
}
.api-dot{width:7px;height:7px;border-radius:50%;background:#c7c7cc}
.api-dot.ok{background:var(--green);box-shadow:0 0 10px rgba(52,199,89,.45)}

.main{
  min-height:0;
  display:grid;
  place-items:center;
}
.clock-card{
  width:100%;
  padding:clamp(38px,5vh,70px) clamp(30px,5vw,80px);
  border-radius:34px;
  text-align:center;
}
.clock{
  margin:0;
  font-size:clamp(88px,14.5vw,220px);
  line-height:.86;
  font-weight:650;
  letter-spacing:-.075em;
  font-variant-numeric:tabular-nums;
}
.seconds{font-size:50%;opacity:.42;vertical-align:baseline;letter-spacing:-.06em}
.date{
  margin-top:clamp(20px,3vh,32px);
  font-size:clamp(20px,2.4vw,36px);
  font-weight:500;
  letter-spacing:-.025em;
}
.today{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
}

.bottom{
  display:grid;
  grid-template-columns:minmax(210px,.65fr) minmax(0,2fr);
  gap:14px;
}
.info-card{
  min-height:118px;
  padding:20px 22px;
  border-radius:22px;
}
.label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.15em;
}
.status{
  margin-top:10px;
  font-size:clamp(22px,2vw,30px);
  font-weight:650;
}
.status-detail{margin-top:4px;color:var(--muted);font-size:11px}

.schedule-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.schedule-list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:12px;
}
.period{
  min-width:0;
  padding:11px 13px;
  border-radius:15px;
  background:rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.75);
}
.period.current{
  background:linear-gradient(135deg,rgba(124,92,255,.13),rgba(77,156,255,.08));
  border-color:rgba(124,92,255,.3);
}
.period-tag{
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.12em;
}
.period-name{
  margin-top:5px;
  font-size:clamp(13px,1.1vw,16px);
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.period-time{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  font-variant-numeric:tabular-nums;
}

@media(max-width:850px){
  .app{padding:18px;gap:16px}
  .bottom{grid-template-columns:1fr}
}
@media(max-width:600px){
  html,body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .api-pill{display:none}
  .clock{font-size:clamp(68px,18vw,130px)}
  .schedule-list{grid-template-columns:1fr}
  .clock-card{width:100%;padding:45px 20px}
}

.bottom{display:grid;grid-template-columns:1.25fr 1.25fr 1fr 1.15fr;gap:14px;width:min(1380px,94vw);margin:0 auto}
.info-card{min-height:132px;padding:20px 22px;border-radius:22px}
.period-main{margin-top:9px;font-size:clamp(18px,1.65vw,25px);line-height:1.1;font-weight:650;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period-meta{margin-top:7px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.remaining{margin-top:8px;font-size:12px;font-weight:600}
.weather-row{display:flex;align-items:center;gap:12px;margin-top:8px}.weather-icon{font-size:30px}
.weather-temp{font-size:28px;line-height:1;font-weight:650}.weather-condition{margin-top:4px;color:var(--muted);font-size:11px}
.weather-details{margin-top:10px;color:var(--muted);font-size:10px}
.notice-card{min-height:132px;padding:18px 20px;border-radius:22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.notice{font-size:clamp(14px,1.2vw,18px);font-weight:650;letter-spacing:-.02em}
.notice-divider{width:42px;height:1px;margin:13px auto;background:rgba(0,0,0,.12)}
@media(max-width:1100px){.bottom{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.bottom{grid-template-columns:1fr;width:100%}}

.remaining-row{display:flex;align-items:center;gap:12px;margin-top:8px}
.remaining-row .remaining{margin-top:0;white-space:nowrap}
.progress-track{height:5px;flex:1;min-width:70px;max-width:180px;background:rgba(0,0,0,.08);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#7c5cff,#4d9cff);transition:width .5s ease}
</style>
</head>
<body>
<div class="background">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
</div>

<main class="app">
  <header class="glass header">
    <div class="brand">
      <div class="mark">📖</div>
      <div>
        <div class="brand-title">Library</div>

      </div>
    </div>
    <div class="api-pill">
      <span class="api-dot" id="apiDot"></span>
      <span id="apiStatus">ON</span>
    </div>
  </header>

  <section class="main">
    <section class="glass clock-card">
      <div class="clock" id="clock">00:00<span class="seconds">:00</span></div>
      <div class="date" id="date">Loading…</div>

    </section>
  </section>


<section class="bottom">
  <section class="glass info-card period-card">
    <div class="label">Current period</div>
    <div class="period-main" id="currentName">Loading…</div>
    <div class="period-meta" id="currentMeta">—</div>
    <div class="remaining-row"><div class="remaining" id="remaining">—</div><div class="progress-track"><div class="progress-fill" id="periodProgress"></div></div></div>
  </section>

  <section class="glass info-card period-card">
    <div class="label">Next period</div>
    <div class="period-main" id="nextName">Loading…</div>
    <div class="period-meta" id="nextMeta">—</div>
    <div class="remaining" id="nextStarts">—</div>
  </section>

  <section class="glass info-card weather-card">
    <div class="label">Weather</div>
    <div class="weather-row">
      <div class="weather-icon" id="weatherIcon">☀️</div>
      <div>
        <div class="weather-temp" id="weatherTemp">—°</div>
        <div class="weather-condition" id="weatherCondition">Loading…</div>
      </div>
    </div>
    <div class="weather-details" id="weatherDetails">—</div>
  </section>

  <section class="glass notice-card">
    <div class="notice">🚫 No food or drink</div>
    <div class="notice-divider"></div>
    <div class="notice">🔕 Quiet study after 4pm</div>
  </section>
</section>
</main>

<!-- Fullscreen when clock clicked -->
<script>
    const btn = document.getElementById('clock');
    btn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen(); // Request fullscreen
        } else {
            document.exitFullscreen(); // Exit fullscreen
        }
    });
</script>

<script>
const API="https://api.sammyhost.uk";
const WEATHER_LAT=-37.81;
const WEATHER_LON=175.77;
const $=s=>document.querySelector(s);
let timetable=[];
function unixNow(){return Date.now()/1000}
function fmtTime(sec){return new Intl.DateTimeFormat("en-NZ",{timeZone:"Pacific/Auckland",hour:"numeric",minute:"2-digit",hour12:false}).format(new Date(sec*1000))}
function duration(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),h=Math.floor(m/60),r=m%60;return h?`${h}h ${String(r).padStart(2,"0")}m`:`${m} min`}
function updateClock(){
  const now=new Date(), p=new Intl.DateTimeFormat("en-NZ",{timeZone:"Pacific/Auckland",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(now);
  const h=p.find(x=>x.type==="hour")?.value||"00",m=p.find(x=>x.type==="minute")?.value||"00",s=p.find(x=>x.type==="second")?.value||"00";
  $("#clock").innerHTML=`${h}&nbsp;:&nbsp;${m}<span class="seconds">&nbsp;:&nbsp;${s}</span>`;
  $("#date").textContent=new Intl.DateTimeFormat("en-NZ",{timeZone:"Pacific/Auckland",weekday:"long",day:"numeric",month:"long"}).format(now);
  updatePeriods();
}
async function getJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error(r.status);return r.json()}
function normalise(x){
  if(!x||typeof x!=="object")return null;
  const s=Number(x.start_time??x.startTime??x.start),e=Number(x.end_time??x.endTime??x.end);
  if(!Number.isFinite(s)||!Number.isFinite(e))return null;
  return{name:String(x.name??x.title??x.label??x.period??"Period"),start:s,end:e}
}
function extract(data){
  const a=[];
  function walk(v){
    if(Array.isArray(v))return v.forEach(walk);
    if(v&&typeof v==="object"){const n=normalise(v);if(n)a.push(n);Object.values(v).forEach(walk)}
  }
  walk(data);
  const seen=new Set();
  return a.filter(x=>{const k=x.name+x.start+x.end;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.start-b.start);
}
async function loadSchool(){
  try{
    const data=await getJSON(`${API}/timetable-for-date?unix_time=${unixNow()}`);
    timetable=extract(data);
    $("#apiDot").classList.add("ok");$("#apiStatus").textContent="ON";
    updatePeriods();
  }catch(e){
    $("#apiDot").classList.remove("ok");$("#apiStatus").textContent="School API unavailable";
    $("#currentName").textContent="Unavailable";$("#currentMeta").textContent="";$("#remaining").textContent="";$("#periodProgress").style.width="0%";
    $("#nextName").textContent="Unavailable";$("#nextMeta").textContent="";$("#nextStarts").textContent="";
  }
}
function updatePeriods(){
  if(!timetable.length)return;
  const now=unixNow(),cur=timetable.find(x=>now>=x.start&&now<x.end),next=timetable.find(x=>x.start>now);
  if(cur){
  $("#currentName").textContent=cur.name;
  $("#currentMeta").textContent=`${fmtTime(cur.start)} – ${fmtTime(cur.end)}`;
  $("#remaining").textContent=`${duration(cur.end-now)} remaining`;
  const pct=Math.max(0,Math.min(100,((now-cur.start)/(cur.end-cur.start))*100));
  periodProgress.style.width=pct+"%";
}
  else{$("#currentName").textContent=now<timetable[0].start?"Before school":"School day finished";$("#currentMeta").textContent="";$("#remaining").textContent="";periodProgress.style.width="0%"}
  if(next){$("#nextName").textContent=next.name;$("#nextMeta").textContent=`Starts ${fmtTime(next.start)}`;$("#nextStarts").textContent=`in ${duration(next.start-now)}`}
  else{$("#nextName").textContent="No more periods";$("#nextMeta").textContent="";$("#nextStarts").textContent=""}
}
const wx={0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",80:"Rain showers",81:"Rain showers",82:"Heavy showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};
const emoji=c=>[0,1].includes(c)?"☀️":[2,3].includes(c)?"☁️":[45,48].includes(c)?"🌫️":[51,53,55,61,63,65,80,81,82].includes(c)?"🌧️":[71,73,75].includes(c)?"❄️":[95,96,99].includes(c)?"⛈️":"🌤️";
async function loadWeather(){
  try{
    const d=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=temperature_2m,apparent_temperature,weather_code&timezone=Pacific%2FAuckland`);
    const c=d.current;$("#weatherIcon").textContent=emoji(c.weather_code);$("#weatherTemp").textContent=`${Math.round(c.temperature_2m)}°`;$("#weatherCondition").textContent=wx[c.weather_code]||"Current conditions";$("#weatherDetails").textContent=`Feels ${Math.round(c.apparent_temperature)}° · `;
  }catch(e){$("#weatherIcon").textContent="—";$("#weatherTemp").textContent="—°";$("#weatherCondition").textContent="Weather unavailable";$("#weatherDetails").textContent=""}
}
updateClock();loadSchool();loadWeather();
setInterval(updateClock,1000);setInterval(loadSchool,60000);setInterval(loadWeather,600000);
</script>
</body>
</html>
